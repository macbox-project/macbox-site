name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

# The three permissions the official Pages deploy action needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel a run that is mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # root/ is the published site, verbatim.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: root

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
